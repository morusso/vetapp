services:
  db:
    image: postgres:16-alpine
    container_name: vetapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./deployment/docker/dev_files/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetapp -d vetapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: vetapp_backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: vetapp
      EMAIL_HOST: mailcatcher
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNELS_REDIS_URL: redis://redis:6379/1
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailcatcher:
        condition: service_started
      ollama:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: vetapp_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: vetapp_celery_worker
    restart: unless-stopped
    command: celery -A vetapp worker --loglevel=info
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: vetapp
      EMAIL_HOST: mailcatcher
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNELS_REDIS_URL: redis://redis:6379/1
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      ollama:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: vetapp_celery_beat
    restart: unless-stopped
    command: celery -A vetapp beat --loglevel=info
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: vetapp
      EMAIL_HOST: mailcatcher
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  flower:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: vetapp_flower
    restart: unless-stopped
    command: celery -A vetapp flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: vetapp_frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - vetapp_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  mailcatcher:
    image: schickling/mailcatcher
    container_name: vetapp_mailcatcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

  # Local LLM used to draft client-facing messages (see backend/notifications/ai.py).
  # Runs entirely on-prem so clinical/treatment history never leaves this stack -
  # only 127.0.0.1 is exposed, and the model is pulled once into a named volume.
  ollama:
    image: ollama/ollama:latest
    container_name: vetapp_ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: qwen2.5:3b-instruct
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL"
        wait
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - vetapp_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  vetapp_frontend_node_modules:
  vetapp_ollama_data:
