services:
  db:
    image: postgres:16-alpine
    container_name: vetapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./deployment/docker/dev_files/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetapp -d vetapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: vetapp_backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetapp
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: vetapp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SCHEMA: vetapp
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: vetapp_frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - vetapp_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  vetapp_frontend_node_modules:
